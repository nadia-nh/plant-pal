name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 * * 1'  # every Monday at noon UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/health")
          # Any HTTP response (including 401) means the project is up and active
          if [ "$STATUS" = "000" ]; then
            echo "Error: could not reach Supabase (connection failed)"
            exit 1
          fi
          echo "Supabase is active (HTTP $STATUS)"
