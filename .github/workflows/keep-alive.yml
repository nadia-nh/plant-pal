name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 * * 1'  # every Monday at noon UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Testing URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/health")
          echo "HTTP status: $STATUS"
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/auth/v1/health")
          echo "Auth health status: $STATUS2"
          echo "Done"
